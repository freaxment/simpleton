name: Build Simpleton

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  JUCE_TAG: 8.0.15

jobs:
  macos:
    name: macOS (VST3 + AU, universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Fetch JUCE
        run: git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE libs/JUCE
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSIMPLETON_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build
      - name: auval + self-test host
        run: |
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx Smpl Frxm
          ./build/SimpletonTest_artefacts/Release/SimpletonTest snapshots
      - name: Pack bundles (keeps permissions)
        run: tar -czf macOS.tar.gz -C build/Simpleton_artefacts/Release VST3/Simpleton.vst3 AU/Simpleton.component
      - uses: actions/upload-artifact@v4
        with:
          name: macOS
          path: macOS.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: snapshots/*.png

  windows:
    name: Windows (VST3, x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch JUCE
        run: git clone --depth 1 --branch $env:JUCE_TAG https://github.com/juce-framework/JUCE libs/JUCE
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release --target Simpleton_VST3
      - name: Validate with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          & .\pluginval\pluginval.exe --strictness-level 5 --validate-in-process --validate "build\Simpleton_artefacts\Release\VST3\Simpleton.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: build/Simpleton_artefacts/Release/VST3

  package:
    name: Zip macOS + Windows
    needs: [macos, windows]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble archive
        run: |
          VERSION=$(grep -oE 'project\(Simpleton VERSION [0-9.]+' CMakeLists.txt | grep -oE '[0-9.]+$')
          NAME="Simpleton-by-Freaxment-v$VERSION-macOS-Windows"
          mkdir -p "$NAME/macOS" "$NAME/Windows"
          tar -xzf artifacts/macOS/macOS.tar.gz -C "$NAME/macOS"
          cp -R artifacts/Windows/Simpleton.vst3 "$NAME/Windows/"
          cp packaging/INSTALL.txt "$NAME/"
          ditto -c -k --keepParent "$NAME" "$NAME.zip"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          echo "Archive: $NAME.zip"; unzip -l "$NAME.zip" | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.zip
      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.NAME }}.zip
